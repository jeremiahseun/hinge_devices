name: CI

on:
  # Only main. Every other branch is covered by `pull_request`, which tests
  # the merge result rather than the branch head — a better signal anyway.
  #
  # `branches: ["**"]` here meant a branch with an open PR fired both events,
  # so every push ran the whole matrix twice: double the minutes, and two
  # conflicting sets of check notifications for one commit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Supersede in-flight runs for the same ref, so pushing a fix does not leave
# the previous run burning a runner and reporting a failure that is already
# obsolete.
#
# Never on main: each commit there is the release candidate, and cancelling
# one because the next landed would leave a merge with no verified build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# A published package's guarantees are only as good as what CI enforces.
# Everything this repo claims — formatting, zero analyzer issues, green tests,
# versions in step across ecosystems, one shared Android codebase, and a
# pub.dev score of 160 — is checked here on every pull request and on every
# commit that reaches main, so none of it can quietly rot.

jobs:
  contracts:
    name: Cross-package contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # These two run before anything else: they are cheap, and they catch the
      # failure modes that are invisible inside a single package.
      - name: Versions are in step across pub.dev and npm
        run: dart run tool/check_versions.dart

      - name: The shared Android code has not drifted between packages
        run: dart run tool/sync_shared.dart --check

  flutter:
    name: Flutter — analyze, test and score
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib bin test example/lib example/tool

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test

      - name: Lint the example app's manifest for foldable continuity
        run: dart run bin/check_manifest.dart example/android/app/src/main/AndroidManifest.xml

      - name: Publish dry run
        run: flutter pub publish --dry-run

      - name: Score with pana
        run: |
          flutter pub global activate pana
          # Fail below a perfect score. Every deduction pana reports is
          # something a user of this package would notice.
          flutter pub global run pana --no-warning --exit-code-threshold 0 .

  android:
    name: Flutter — build the Android plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      # The Kotlin is the half of this package that Dart tests cannot reach,
      # so it gets compiled on every push.
      - name: Build the example APK
        working-directory: flutter/example
        run: flutter build apk --debug

  react-native:
    name: React Native — typecheck and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: react-native/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The build is the part Metro never exercises: it resolves the
      # `react-native` field straight to src/, so a broken `main`/`module`
      # only surfaces for a consumer using require, Jest in a host app, or a
      # bundler reading `main` — i.e. after publishing. It broke exactly that
      # way once.
      - name: Build
        run: npm run prepare

      - name: Verify every declared entry point exists
        run: npm run check:entry-points

      - name: Verify the published tarball contents
        run: npm pack --dry-run

  conformance:
    name: Both implementations agree
    runs-on: ubuntu-latest
    # The whole promise of this repo is that posture means the same thing on
    # both frameworks. spec/posture_vectors.json is that promise written down,
    # and the two test jobs above are what enforce it — a rule changed in one
    # language and not the other fails there, not here.
    needs: [contracts, flutter, react-native]
    steps:
      - run: echo "Dart and TypeScript both passed spec/posture_vectors.json."
