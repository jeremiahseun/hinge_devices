buildscript {
    ext.kotlin_version = project.properties['HingeDevices_kotlinVersion'] ?: '1.9.24'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // A consuming app's own AGP version wins over this; it is pinned
        // only so the module builds standalone. Kept in step with the Flutter
        // plugin so the two vendored copies of core-android compile against
        // the same toolchain.
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// New Architecture only. The legacy bridge would double the native surface
// and the testing matrix for a shrinking audience, and RN 0.76+ defaults to
// the new architecture anyway.
apply plugin: 'com.facebook.react'

android {
    namespace 'dev.jeremiahseun.hinge_devices'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        main {
            java.srcDirs += 'src/main/kotlin'
            // Generated TurboModule interfaces.
            java.srcDirs += "${project.buildDir}/generated/source/codegen/java"
        }
    }
    defaultConfig {
        // The package is safe on any device; foldable code paths are guarded.
        minSdk 24
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'com.facebook.react:react-android'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'androidx.window:window:1.3.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
