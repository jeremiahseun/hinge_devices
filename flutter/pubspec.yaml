name: hinge_devices
description: A unified posture, hinge and display model for foldable devices. Posture-first, capability-driven, and safe to add to any app.
version: 0.3.1
repository: https://github.com/jeremiahseun/hinge_devices
issue_tracker: https://github.com/jeremiahseun/hinge_devices/issues
documentation: https://github.com/jeremiahseun/hinge_devices#readme

# Max five, and they are how people find the package by browsing rather than
# by name. "foldable" is the obvious one; the rest cover what people actually
# search for when they hit this problem.
topics:
  - foldable
  - hinge
  - adaptive-ui
  - dual-screen
  - responsive

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # lib/testing.dart ships the posture test kit, so flutter_test is a real
  # dependency rather than a dev one.
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      # Android only. The package still compiles and runs on every other
      # platform — it reports a rigid device and emits nothing — but that is
      # graceful degradation, not support, and pub.dev's platform badges are
      # read as a claim of support.
      #
      # Declaring iOS here to widen discovery would mean an iPhone developer
      # installs this expecting foldable support and gets a permanent
      # isFoldable: false. It would also spend the signal early: when real
      # iPhone Duo support lands in 0.4, the badge is how people find out.
      android:
        package: dev.jeremiahseun.hinge_devices
        pluginClass: HingeDevicesPlugin
