name: foldable_runtime
description: A unified posture, hinge and display model for foldable devices. Posture-first, capability-driven, and safe to add to any app.
version: 0.1.0
repository: https://github.com/jeremiahseun/hinge_devices
issue_tracker: https://github.com/jeremiahseun/hinge_devices/issues

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.jeremiahseun.foldable_runtime
        pluginClass: FoldableRuntimePlugin
